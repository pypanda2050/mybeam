version: '3.8'

services:
  gcs-emulator:
    build: .
    image: fsouza/fake-gcs-server
    container_name: fake-gcs-server
    ports:
      - "4443:4443"
    volumes:
      - ./gcs-data:/data
    command: -scheme http

  postgres:
    image: postgres:13
    container_name: postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"

  cassandra:
    image: cassandra:4.1
    container_name: cassandra-test
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: test-cluster
      CASSANDRA_DC: datacenter1
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10
